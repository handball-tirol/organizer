<style>
:root{--bg:#f4f4f4;--surface:#fff;--ink:#141414;--muted:#666;--line:#dcdcdc;--mark:#c8102e;--danger:#a60f26}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--surface:#1c1c1c;--ink:#f2f2f2;--muted:#a0a0a0;--line:#333;--mark:#d6203c;--danger:#ff8a8a}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
form{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--mark);border-radius:8px;padding:24px;width:100%;max-width:380px;display:grid;gap:12px}
img{width:56px;height:56px;border-radius:10px}
h1{margin:0;font-size:22px}
label{display:grid;gap:4px;font-weight:600;font-size:14px}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%}
.chk{display:flex;gap:8px;align-items:center;font-weight:400}
.chk input{width:auto}
button{font:inherit;font-weight:700;padding:11px 14px;border:0;border-radius:6px;background:var(--mark);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#msg{color:var(--danger);font-weight:600;font-size:14px;min-height:1em;margin:0}
#msg.info{color:var(--muted)}

<form id="f" novalidate>
 <img src="icon-192.png" alt="">
 <h1>Anmeldung</h1>
 <label>E-Mail<input id="em" type="email" autocomplete="username" required></label>
 <label>Passwort<input id="pw" type="password" autocomplete="current-password" required></label>
 <label class="chk"><input type="checkbox" id="keep">Angemeldet bleiben (nur auf deinem eigenen Gerät)</label>

 <button id="ok" type="submit">Anmelden</button>
</form>

<script>(function(){

var SB={url:'https://oitptywgcmpwqhintsvj.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pdHB0eXdnY21wd3FoaW50c3ZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMjIwMzQsImV4cCI6MjEwODU5ODAzNH0.h1rHU6JxuSikXMjNGbWbfasIQcTGbVioI_WqgagQ7Fk'},APP='ac88ced43c48d2e099c7935bc6f60e59f20e011e8581b7ea652959ea30a86420',SKEY='ht-sb-session',KKEY='ht-sb-keep';

try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
var MAXAGE=30*864e5;
function loadSess(){var st=['localStorage','sessionStorage'];for(var i=0;i<2;i++){try{var v=JSON.parse(window[st[i]].getItem(SKEY)||'null');if(v&&v.refresh_token){if(v.since&&Date.now()-v.since>MAXAGE){clearSess();say('Bitte neu anmelden (spätestens alle 30 Tage).',true);return null}return {s:v,keep:i===0}}}catch(e){}}return null}
function storeSess(s,keep){try{var j=JSON.stringify(s);if(keep){localStorage.setItem(SKEY,j);sessionStorage.removeItem(SKEY);localStorage.setItem(KKEY,'1')}else{sessionStorage.setItem(SKEY,j);localStorage.removeItem(SKEY);localStorage.removeItem(KKEY)}}catch(e){}}

async function auth(path,body){
 var r=await fetch(SB.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
 var j=await r.json().catch(function(){return {}});
 if(!r.ok)throw err(j.msg||j.error_description||j.message||('Fehler '+r.status),r.status);
 return j;

async function sha(t){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0')}).join('')}
async function start(s,keep){
 say('App wird geladen …',true);busy(true);
 if(!s.exp||s.exp-Date.now()<60000){s=mk(await auth('token?grant_type=refresh_token',{refresh_token:s.refresh_token}),s);storeSess(s,keep)}

 if(r.status===401||r.status===403)throw err('Sitzung abgelaufen, bitte neu anmelden.',401);

});

if(saved){start(saved.s,saved.keep).catch(function(x){busy(false);if(x.status&&x.status<500&&x.status!==404)clearSess();say(x.message||'Die App konnte nicht geladen werden.');$('em').focus()})}
else $('em').focus();
